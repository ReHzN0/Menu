<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZURE MENU V12.3</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #a2d2ff; --text: #e6edf3; --border: #30363d; --out: #f85149; --disc: #238636; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        #home-screen { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; }
        .cat-card { width: 100%; max-width: 350px; background: var(--accent); color: #0d1117; padding: 25px; margin-bottom: 15px; border-radius: 20px; text-align: center; font-size: 1.3rem; font-weight: 900; cursor: pointer; border: none; transition: 0.2s; }

        #category-view, #admin-view { display: none; padding-top: 130px; padding-bottom: 120px; }
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); z-index: 2000; border-bottom: 1px solid var(--border); }
        .scroll-menu { display: flex; overflow-x: auto; padding: 15px 20px; gap: 10px; scrollbar-width: none; }
        .nav-item { padding: 10px 22px; border-radius: 25px; border: 1px solid var(--border); background: var(--card-bg); white-space: nowrap; font-size: 0.85rem; cursor: pointer; color: #8b949e; transition: 0.3s; }
        .nav-item.active { background: var(--accent); color: #0d1117; font-weight: bold; border-color: var(--accent); }

        .container { max-width: 500px; margin: auto; padding: 0 15px; }
        .item { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; position: relative; }
        .item.is-out { opacity: 0.4; filter: grayscale(1); }
        .item-img { font-size: 1.8rem; margin-right: 15px; }

        .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 15px; margin-bottom: 12px; }
        .footer { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 460px; background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--accent); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 onclick="openAuth()" style="color:var(--accent); letter-spacing:10px; margin-bottom:40px; cursor:pointer;">AZURE</h1>
    <div class="cat-card" onclick="showCategory('GINLER')">GINLER</div>
    <div class="cat-card" onclick="showCategory('SHOTLAR')">SHOTLAR</div>
    <div class="cat-card" onclick="showCategory('LİKÖRLER')">LİKÖRLER</div>
    <div id="admin-entry" style="display:none;" class="cat-card" onclick="showAdmin('ORDERS')">YÖNETİM PANELİ</div>
</div>

<div id="category-view">
    <div class="top-nav">
        <div style="text-align:center; padding:10px; font-size:0.7rem; color:var(--accent); cursor:pointer;" onclick="goHome()">← ANA SAYFA</div>
        <div class="scroll-menu" id="user-nav">
            <div class="nav-item" onclick="showCategory('GINLER')">GINLER</div>
            <div class="nav-item" onclick="showCategory('SHOTLAR')">SHOTLAR</div>
            <div class="nav-item" onclick="showCategory('LİKÖRLER')">LİKÖRLER</div>
        </div>
    </div>
    <div class="container" id="menu-list"></div>
    <div class="footer"><div id="cart-total" style="font-size:1.5rem; font-weight:900; color:var(--accent);">0 TL</div><button style="background:var(--accent); border:none; padding:12px 25px; border-radius:12px; font-weight:900;" onclick="sendOrder()">SİPARİŞ</button></div>
</div>

<div id="admin-view">
    <div class="top-nav">
        <div style="text-align:center; padding:10px; font-size:0.7rem; color:var(--accent); cursor:pointer;" onclick="goHome()">← ANA SAYFA</div>
        <div class="scroll-menu" id="admin-nav">
            <div class="nav-item" onclick="showAdmin('ORDERS')">SİPARİŞLER</div>
            <div class="nav-item" onclick="showAdmin('GINLER')">GINLER</div>
            <div class="nav-item" onclick="showAdmin('SHOTLAR')">SHOTLAR</div>
            <div class="nav-item" onclick="showAdmin('LİKÖRLER')">LİKÖRLER</div>
        </div>
    </div>
    <div class="container" id="admin-list"></div>
</div>

<script>
    const CONFIG = { phone: "905333875829", m: "MjYwNg==" };
    let stock = JSON.parse(localStorage.getItem('az_stk_v12_3')) || {};
    let prices = JSON.parse(localStorage.getItem('az_prc_v12_3')) || {};

    const inventory = [
        // GİNLER (Botanist Çıktı, Mosaik Geldi) -
        { id: 'gin1', cat: 'GINLER', name: 'Nikka Coffey Gin', img: '🇯🇵' },
        { id: 'gin2', cat: 'GINLER', name: 'Ki No Bi Kyoto Gin', img: '⛩️' },
        { id: 'gin3', cat: 'GINLER', name: 'Etsu Gin', img: '🌊' },
        { id: 'gin4', cat: 'GINLER', name: 'Roku Gin', img: '🌸' },
        { id: 'gin5', cat: 'GINLER', name: 'Drumshanbo Gunpowder', img: '🍀' },
        { id: 'gin6', cat: 'GINLER', name: 'Skagerrak Gin', img: '⚓' },
        { id: 'gin7', cat: 'GINLER', name: 'Malfy Limone', img: '🍋' },
        { id: 'gin8', cat: 'GINLER', name: 'Malfy Original', img: '🇮🇹' },
        { id: 'gin9', cat: 'GINLER', name: 'Malfy Rose', img: '🌹' },
        { id: 'gin10', cat: 'GINLER', name: 'Tanqueray', img: '🍸' },
        { id: 'gin11', cat: 'GINLER', name: 'Tanqueray No. Ten', img: '🔟' },
        { id: 'gin12', cat: 'GINLER', name: 'Bombay Sapphire', img: '💎' },
        { id: 'gin13', cat: 'GINLER', name: 'Beefeater Pink', img: '🍓' },
        { id: 'gin14', cat: 'GINLER', name: 'Mosaik Gin', img: '🧩' },

        // SHOTLAR
        { id: 'shot1', cat: 'SHOTLAR', name: '1800 Silver Tekila', img: '🌵' },
        { id: 'shot2', cat: 'SHOTLAR', name: 'Havana Club Rom', img: '🇨🇺' },
        { id: 'shot3', cat: 'SHOTLAR', name: 'Smirnoff Red', img: '🇷🇺' },
        { id: 'shot4', cat: 'SHOTLAR', name: 'Smirnoff North', img: '❄️' },
        { id: 'shot5', cat: 'SHOTLAR', name: 'Nemiroff', img: '⚔️' },
        { id: 'shot6', cat: 'SHOTLAR', name: 'Ballantines', img: '🥃' },
        { id: 'shot7', cat: 'SHOTLAR', name: 'Olmeca Tekila Silver', img: '🗿' },
        { id: 'shot8', cat: 'SHOTLAR', name: 'Olmeca Dark Choco', img: '🍫' },

        // LİKÖRLER
        { id: 'lik1', cat: 'LİKÖRLER', name: 'Malibu', img: '🥥' },
        { id: 'lik2', cat: 'LİKÖRLER', name: 'Baileys', img: '🥛' },
        { id: 'lik3', cat: 'LİKÖRLER', name: 'Baileys Choco', img: '🍩' },
        { id: 'lik4', cat: 'LİKÖRLER', name: 'Jest', img: '✨' },
        { id: 'lik5', cat: 'LİKÖRLER', name: 'Mancia', img: '🌿' },
        { id: 'lik6', cat: 'LİKÖRLER', name: 'Skinos', img: '🌲' },
        { id: 'lik7', cat: 'LİKÖRLER', name: 'Jager', img: '🦌' },
        { id: 'lik8', cat: 'LİKÖRLER', name: 'Jager Cold Brew', img: '☕' }
    ];

    inventory.forEach(i => {
        if(stock[i.id] === undefined) stock[i.id] = true;
        if(!prices[i.id]) prices[i.id] = { normal: 200, discount: 150 };
    });

    function showCategory(cat) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('admin-view').style.display = 'none';
        document.getElementById('category-view').style.display = 'block';
        
        // Mavi Sekme Fix
        document.querySelectorAll('#user-nav .nav-item').forEach(n => {
            n.classList.toggle('active', n.innerText === cat);
        });
        
        let h = '';
        inventory.filter(i => i.cat === cat).forEach(item => {
            const isOut = !stock[item.id];
            h += `<div class="item ${isOut ? 'is-out' : ''}" onclick="${isOut ? '' : `addToCart('${item.id}')`}">
                <div style="display:flex; align-items:center;">
                    <div class="item-img">${item.img}</div>
                    <div><span class="name">${item.name}</span><br><small>${prices[item.id].normal} TL</small></div>
                </div>
                <div style="background:var(--accent); color:#000; padding:5px 12px; border-radius:10px; font-weight:900;">+</div>
            </div>`;
        });
        document.getElementById('menu-list').innerHTML = h;
    }

    function showAdmin(mode) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('category-view').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';
        
        document.querySelectorAll('#admin-nav .nav-item').forEach(n => {
            n.classList.toggle('active', n.innerText === mode);
        });
        
        let h = '';
        if(mode === 'ORDERS') { h = '<div style="text-align:center; padding:50px;">Sipariş bekleniyor...</div>'; }
        else {
            inventory.filter(i => i.cat === mode).forEach(item => {
                const isAv = stock[item.id];
                h += `<div class="admin-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>${item.img} ${item.name}</b>
                        <button onclick="toggleStock('${item.id}', '${mode}')" style="background:${isAv ? 'var(--disc)' : 'var(--out)'}; border:none; color:white; padding:5px 15px; border-radius:10px;">${isAv ? 'STOKTA' : 'YOK'}</button>
                    </div>
                    <div style="margin-top:10px; font-size:0.8rem; display:flex; gap:10px;">
                        <span>Normal: ${prices[item.id].normal} TL</span>
                        <span>Dost: ${prices[item.id].discount} TL</span>
                        <button onclick="editItem('${item.id}', '${mode}')" style="background:none; border:1px solid var(--border); color:var(--accent); padding:2px 8px; border-radius:5px;">Düzenle</button>
                    </div>
                </div>`;
            });
        }
        document.getElementById('admin-list').innerHTML = h;
    }

    function toggleStock(id, mode) { stock[id] = !stock[id]; localStorage.setItem('az_stk_v12_3', JSON.stringify(stock)); showAdmin(mode); }
    function editItem(id, mode) {
        const n = prompt("Normal Fiyat:", prices[id].normal);
        const d = prompt("Dost Fiyatı (İndirimli):", prices[id].discount);
        if(n && d) {
            prices[id].normal = parseInt(n);
            prices[id].discount = parseInt(d);
            localStorage.setItem('az_prc_v12_3', JSON.stringify(prices));
            showAdmin(mode);
        }
    }

    function openAuth() { if(btoa(prompt("Admin:")) === CONFIG.m) { document.getElementById('admin-entry').style.display = 'block'; alert("Hoş geldin Boss."); } }
    function goHome() { document.getElementById('home-screen').style.display='flex'; document.getElementById('category-view').style.display='none'; document.getElementById('admin-view').style.display='none'; }
    function addToCart(id) { /* sepet mantığı */ }
</script>
</body>
</html>
