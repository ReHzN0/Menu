<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZURE BAR</title>
    <style>
        :root { --bg: #0d1117; --card-bg: #161b22; --accent: #a2d2ff; --text: #e6edf3; --border: #30363d; --out: #f85149; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* Home Screen */
        #home-screen { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; }
        .cat-card { width: 100%; max-width: 350px; background: var(--accent); color: #0d1117; padding: 30px; margin-bottom: 15px; border-radius: 20px; text-align: center; font-size: 1.3rem; font-weight: 900; cursor: pointer; }
        
        /* Top Nav & Category */
        #category-view { display: none; padding-top: 130px; padding-bottom: 120px; }
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); z-index: 2000; border-bottom: 1px solid var(--border); }
        .scroll-menu { display: flex; overflow-x: auto; padding: 15px 20px; gap: 10px; }
        .nav-item { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); white-space: nowrap; font-size: 0.8rem; cursor: pointer; color: #8b949e; }
        .nav-item.active { background: var(--accent); color: #0d1117; font-weight: bold; }

        /* Items & Cards */
        .container { max-width: 500px; margin: auto; padding: 0 15px; }
        .item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; position: relative; }
        .signature-tag { position: absolute; top: -8px; left: 15px; background: var(--accent); color: #000; font-size: 0.6rem; font-weight: 900; padding: 2px 8px; border-radius: 5px; }
        .details .name { font-weight: 700; font-size: 1rem; color: var(--accent); }
        .details .desc { font-size: 0.7rem; color: #8b949e; display: block; margin-top: 2px; }

        /* Customization Drawer */
        #custom-modal { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-radius: 30px 30px 0 0; z-index: 5000; display: none; padding: 25px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .opt-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .opt-row.out { opacity: 0.4; pointer-events: none; }
        .out-text { color: var(--out); font-size: 0.65rem; font-weight: bold; }

        /* Admin */
        .stock-toggle { padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; margin: 3px; display: inline-block; border: 1px solid var(--border); }
        .stock-toggle.on { background: #238636; color: white; }
        .stock-toggle.off { background: var(--out); color: white; }

        .footer { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 460px; background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--accent); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .total-amount { font-size: 1.5rem; font-weight: 900; color: var(--accent); }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 onclick="openAuth()" style="color:var(--accent); letter-spacing:5px;">AZURE</h1>
    <div class="cat-card" onclick="showCategory('KOKTEYLLER')">KOKTEYLLER</div>
    <div class="cat-card" onclick="showCategory('GIN (CİN)')">GINLER</div>
    <div class="cat-card" onclick="showCategory('SHOTLAR')">SHOTLAR</div>
    <div class="cat-card" onclick="showCategory('LİKÖRLER')">LİKÖRLER</div>
</div>

<div id="category-view">
    <div class="top-nav">
        <div style="text-align:center; padding:10px; font-size:0.7rem; color:var(--accent); cursor:pointer;" onclick="goHome()">← ANA SAYFA</div>
        <div class="scroll-menu">
            <div class="nav-item" onclick="showCategory('KOKTEYLLER')" id="nav-KOKTEYLLER">KOKTEYLLER</div>
            <div class="nav-item" onclick="showCategory('GIN (CİN)')" id="nav-GIN (CİN)">GINLER</div>
            <div class="nav-item" onclick="showCategory('SHOTLAR')" id="nav-SHOTLAR">SHOTLAR</div>
            <div class="nav-item" onclick="showCategory('LİKÖRLER')" id="nav-LİKÖRLER">LİKÖRLER</div>
        </div>
    </div>
    <div class="container" id="menu-list"></div>
    <div class="container" id="admin-stock" style="display:none; margin-top:20px; border-top:1px dashed var(--accent); padding-top:20px;">
        <h4 style="color:var(--accent)">📦 STOK YÖNETİMİ</h4>
        <div id="stock-controls"></div>
    </div>
    <div class="footer">
        <div><div style="font-size: 0.6rem;">TOPLAM</div><div class="total-amount" id="cart-total">0 TL</div></div>
        <button style="background:var(--accent); border:none; padding:12px 25px; border-radius:12px; font-weight:900; cursor:pointer;" onclick="confirmOrder()">SİPARİŞ</button>
    </div>
</div>

<div id="custom-modal">
    <h3 id="modal-title" style="margin-top:0; color:var(--accent)"></h3>
    <div id="options-list"></div>
    <button style="width:100%; margin-top:20px; padding:15px; background:var(--accent); border:none; border-radius:15px; font-weight:bold;" onclick="addToCart()">SEPETE EKLE</button>
    <button style="width:100%; margin-top:10px; background:transparent; border:none; color:#8b949e;" onclick="closeModal()">İptal</button>
</div>

<script>
    const CONFIG = { phone: "905333875829", m: "MjYwNg==" };
    
    // Stok Durumu
    let stock = JSON.parse(localStorage.getItem('bar_stock')) || {
        'Nane': true, 'Kahve': true, 'Süt': true, 'Limon': true, 'Buz': true, 'Çikolata': true
    };

    const inventory = [
        { id: 'BlueVelvet', cat: 'KOKTEYLLER', name: 'Blue Velvet (Signature)', price: 450, desc: 'Baileys, Vodka, Malibu, Süt ve Özel Kahve Karışımı', sig: true, opts: ['Süt', 'Kahve', 'Nane'] },
        { id: 'KiNoBi', cat: 'GIN (CİN)', name: 'Ki No Bi Kyoto Gin', price: 400 },
        { id: 'EtsuP', cat: 'GIN (CİN)', name: 'Etsu Pacific Ocean', price: 350 },
        { id: '1800S', cat: 'SHOTLAR', name: '1800 Silver Tequila', price: 250 },
        { id: 'Skinos', cat: 'LİKÖRLER', name: 'Skinos Mastic', price: 160 }
    ];

    let cart = []; let total = 0; let isAdmin = false; let currentCat = 'KOKTEYLLER'; let pendingItem = null;

    function showCategory(cat) {
        currentCat = cat;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('category-view').style.display = 'block';
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-'+cat).classList.add('active');
        renderItems();
    }

    function renderItems() {
        let html = '';
        const items = inventory.filter(i => i.cat === currentCat);
        items.forEach(item => {
            html += `
            <div class="item" onclick="handleItemClick('${item.id}')">
                ${item.sig ? '<div class="signature-tag">YAZARIN SEÇİMİ</div>' : ''}
                <div class="details">
                    <span class="name">${item.name}</span>
                    <span class="desc">${item.desc || 'Premium Seçki'}</span>
                    <span style="font-size:0.8rem; color:white; margin-top:5px; display:block;">${item.price} TL</span>
                </div>
                <div style="color:var(--accent); font-size:1.5rem;">+</div>
            </div>`;
        });
        document.getElementById('menu-list').innerHTML = html;
        if(isAdmin) renderAdminStock();
    }

    function handleItemClick(id) {
        const item = inventory.find(i => i.id === id);
        if(item.cat === 'KOKTEYLLER') {
            pendingItem = {...item, selectedOpts: []};
            openCustomModal(item);
        } else {
            cart.push({name: item.name, price: item.price});
            updateTotal();
        }
    }

    function openCustomModal(item) {
        document.getElementById('modal-title').innerText = item.name;
        let optHtml = '';
        item.opts.forEach(opt => {
            const isOut = !stock[opt];
            optHtml += `
            <div class="opt-row ${isOut ? 'out' : ''}">
                <span>${opt} ${isOut ? '<span class="out-text">(STOKTA YOK)</span>' : ''}</span>
                <input type="checkbox" ${isOut ? 'disabled' : ''} onchange="toggleOpt('${opt}')">
            </div>`;
        });
        document.getElementById('options-list').innerHTML = optHtml;
        document.getElementById('custom-modal').style.display = 'block';
    }

    function toggleOpt(opt) {
        const idx = pendingItem.selectedOpts.indexOf(opt);
        if(idx > -1) pendingItem.selectedOpts.splice(idx, 1);
        else pendingItem.selectedOpts.push(opt);
    }

    function addToCart() {
        cart.push({name: pendingItem.name, price: pendingItem.price, opts: [...pendingItem.selectedOpts]});
        updateTotal();
        closeModal();
    }

    function updateTotal() {
        total = cart.reduce((s, i) => s + i.price, 0);
        document.getElementById('cart-total').innerText = total + " TL";
    }

    function renderAdminStock() {
        let html = '';
        Object.keys(stock).forEach(key => {
            html += `<div class="stock-toggle ${stock[key]?'on':'off'}" onclick="toggleStock('${key}')">${key}</div>`;
        });
        document.getElementById('stock-controls').innerHTML = html;
        document.getElementById('admin-stock').style.display = 'block';
    }

    function toggleStock(key) {
        stock[key] = !stock[key];
        localStorage.setItem('bar_stock', JSON.stringify(stock));
        renderAdminStock();
        if(currentCat === 'KOKTEYLLER') renderItems();
    }

    function confirmOrder() {
        if(cart.length === 0) return;
        let msg = '🍸 *YENİ SİPARİŞ*%0A';
        cart.forEach(i => {
            msg += `• ${i.name} ${i.opts ? '('+i.opts.join(', ')+')' : ''}%0A`;
        });
        window.open(`https://wa.me/${CONFIG.phone}?text=${msg}%0A*TOPLAM: ${total} TL*`);
        cart = []; total = 0; updateTotal();
    }

    function openAuth() {
        const p = prompt("Şifre:");
        if(btoa(p) === CONFIG.m) { isAdmin = true; renderItems(); }
    }

    function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }
    function goHome() { document.getElementById('home-screen').style.display='flex'; document.getElementById('category-view').style.display='none'; }

    renderItems();
</script>
</body>
</html>
