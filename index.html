<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZURE BAR V12.3</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #a2d2ff; --text: #e6edf3; --border: #30363d; --success: #238636; --wp: #25D366; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: default; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; user-select: none; -webkit-user-select: none; overflow-x: hidden; }

        .container { max-width: 500px; margin: auto; padding: 20px; padding-bottom: 100px; }
        h1 { text-align: center; color: var(--accent); letter-spacing: 5px; margin: 30px 0; cursor: pointer; text-transform: uppercase; }
        
        .cat-title { font-size: 0.7rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin: 25px 0 12px; font-weight: 800; opacity: 0.8; }
        
        /* Modern Kart Tasarımı (Radyo butonu yok!) */
        .menu-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .menu-item:active { transform: scale(0.98); border-color: var(--accent); }
        .item-info .name { font-weight: 700; font-size: 1rem; color: var(--text); display: block; }
        .item-info .price { color: var(--accent); font-weight: 600; margin-top: 5px; display: block; font-size: 0.9rem; }
        .item-info .desc { font-size: 0.75rem; color: #8b949e; margin-top: 5px; display: block; line-height: 1.3; }

        /* Silk Seçim Alanı */
        .variant-box { border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; position: relative; }
        .variant-box.selected { border-color: var(--accent); background: rgba(162, 210, 255, 0.05); }
        .variant-box.selected::after { content: '✓'; position: absolute; right: 15px; top: 15px; color: var(--accent); font-weight: 900; }

        /* Modal & Overlay */
        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 1000; display: none; }
        #order-modal { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-radius: 25px 25px 0 0; padding: 25px; z-index: 1001; transform: translateY(100%); transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); border-top: 1px solid var(--accent); }
        #order-modal.open { transform: translateY(0); }

        /* IBAN Box */
        .iban-box { background: #000; padding: 18px; border-radius: 14px; margin: 15px 0; color: var(--accent); font-family: monospace; font-size: 0.85rem; text-align: center; border: 1px dashed var(--border); }
        .wp-btn { background: var(--wp); color: white; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; text-decoration: none; margin-top: 10px; }

        /* Admin Panel */
        #admin-panel { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; padding: 25px; overflow-y: auto; }
        .order-card { background: var(--card); border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="askAdmin()">AZURE</h1>
    
    <div class="cat-title">İMZA KOKTEYLLER</div>
    <div class="menu-item" onclick="openSilk()">
        <div class="item-info">
            <span class="name">MIDNIGHT SILK</span>
            <span class="desc">3cl Kahve, 8cl Süt, 5cl Baileys + Seçimin</span>
            <span class="price">450 - 600 TL</span>
        </div>
        <div style="color:var(--accent); font-size:1.5rem; font-weight:900;">+</div>
    </div>

    <div class="cat-title">PREMİUM GİNLER</div>
    <div id="gin-list">
        </div>
</div>

<div id="modal-overlay" onclick="closeSilk()"></div>
<div id="order-modal">
    <h3 style="margin-top:0; color:var(--accent);">Stilini Seç</h3>
    <div id="variant-list">
        </div>
    <button onclick="confirmOrder()" style="width:100%; background:var(--accent); color:#0d1117; border:none; padding:18px; border-radius:15px; font-weight:900; margin-top:15px; font-size:1rem;">SİPARİŞİ TAMAMLA</button>
</div>

<div id="payment-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:var(--card); padding:30px; border-radius:20px; border:1px solid var(--accent); z-index:3000; width:90%; max-width:350px; text-align:center;">
    <h3 style="margin:0">Sipariş Hazır!</h3>
    <div class="iban-box" onclick="copyIban()">TR00 0000 0000 0000 0000 0000 00</div>
    <a href="#" id="wp-link" class="wp-btn">WhatsApp'tan Bildir</a>
    <p onclick="location.reload()" style="margin-top:20px; font-size:0.8rem; opacity:0.5;">Kapat</p>
</div>

<script>
    const CONFIG = { phone: "905333875829", pass: "MjYwNg==" };
    
    const gins = [
        { name: 'Nikka Coffey Gin', p: 420 },
        { name: 'Ki No Bi Kyoto', p: 400 },
        { name: 'Etsu Pacific Ocean', p: 350 },
        { name: 'Roku Gin', p: 250 }
    ];

    const variants = [
        { id: 'v1', name: 'Classic Silk', desc: '5cl Vodka + 3cl Malibu', p: 450 },
        { id: 'v2', name: 'Botanical Silk', desc: '5cl Gin + 3cl Malibu', p: 480 },
        { id: 'v3', name: 'Aged Silk', desc: '5cl Vodka + 5cl Havana 7 (Malibu Yok)', p: 500 },
        { id: 'v4', name: 'Double Choco', desc: 'Classic + Baileys & Olmeca Choco', p: 600 }
    ];

    let selectedVariant = 'v1';

    function init() {
        let h = '';
        gins.forEach(g => {
            h += `<div class="menu-item"><div class="item-info"><span class="name">${g.name}</span><span class="price">${g.p} TL</span></div></div>`;
        });
        document.getElementById('gin-list').innerHTML = h;
    }

    function openSilk() {
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('order-modal').classList.add('open');
        renderVariants();
    }

    function renderVariants() {
        let h = '';
        variants.forEach(v => {
            h += `<div class="variant-box ${selectedVariant === v.id ? 'selected' : ''}" onclick="selectedVariant='${v.id}';renderVariants();">
                <span style="font-weight:800; display:block;">${v.name}</span>
                <span style="font-size:0.75rem; opacity:0.6;">${v.desc}</span>
                <span style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:var(--accent); font-weight:700;">${v.p} TL</span>
            </div>`;
        });
        document.getElementById('variant-list').innerHTML = h;
    }

    function confirmOrder() {
        const v = variants.find(x => x.id === selectedVariant);
        document.getElementById('order-modal').classList.remove('open');
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('payment-modal').style.display = 'block';
        document.getElementById('wp-link').href = `https://wa.me/${CONFIG.phone}?text=Sipariş: ${v.name}`;
    }

    function closeSilk() {
        document.getElementById('order-modal').classList.remove('open');
        document.getElementById('modal-overlay').style.display = 'none';
    }

    function askAdmin() { if(btoa(prompt("Admin:")) === CONFIG.pass) alert("Admin Paneli Yakında!"); }
    function copyIban() { navigator.clipboard.writeText("TR00 0000 0000 0000 0000 0000 00"); alert("Kopyalandı!"); }

    init();
</script>
</body>
</html>
