<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUEST MENU</title>
    <style>
        :root { --bg: #0a0a0c; --card-bg: #161b22; --accent: #f59e0b; --text: #e6edf3; --border: #30363d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 20px 120px; }
        .container { max-width: 500px; margin: auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--accent); letter-spacing: 4px; cursor: pointer; font-weight: 900; }
        .mode-btn { position: fixed; top: 10px; right: 10px; background: #21262d; color: #8b949e; padding: 8px 12px; border-radius: 8px; font-size: 0.65rem; border: 1px solid var(--border); z-index: 3000; cursor: pointer; }
        .cat-title { font-size: 0.85rem; color: var(--accent); margin: 25px 0 12px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .cat-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        .item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .img-box { width: 55px; height: 75px; background: #21262d; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .details .name { font-weight: 600; font-size: 0.9rem; display: block; }
        .details .prices { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        .btn { background: #30363d; color: white; border: 1px solid #484f58; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .qty { font-weight: bold; min-width: 20px; text-align: center; color: var(--accent); }
        #pass-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 4000; }
        .modal-card { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 1px solid var(--accent); text-align: center; width: 280px; }
        .modal-card input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid var(--border); background: #0d1117; color: white; text-align: center; font-size: 1.5rem; letter-spacing: 5px; }
        .footer { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 460px; background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--accent); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .total-amount { font-size: 1.5rem; font-weight: 900; color: var(--accent); }
        #admin-panel { margin-top: 30px; padding: 20px; background: #0d1117; border-radius: 20px; border: 1px dashed var(--accent); display: none; }
        .full-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; padding: 20px; overflow-y: auto; }
        .receipt-card { max-width: 450px; margin: 40px auto; background: #161b22; padding: 25px; border-radius: 24px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="mode-btn" onclick="openAuth()">MOD DEĞİŞTİR</div>

<div id="pass-modal">
    <div class="modal-card">
        <div style="color:var(--accent); font-weight:900;">YÖNETİCİ GİRİŞİ</div>
        <input type="password" id="passInput" placeholder="••••" maxlength="4" inputmode="numeric">
        <button onclick="verifyPass()" style="width:100%; padding:12px; background:var(--accent); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">ONAYLA</button>
        <p style="margin-top:15px; font-size:0.7rem; color:#8b949e; cursor:pointer;" onclick="closeModal()">Vazgeç</p>
    </div>
</div>

<div class="container">
    <header><h1 onclick="openAuth()">MENU</h1><p style="font-size: 0.7rem; color: #8b949e;">Premium Koleksiyon</p></header>
    <div id="menu-list"></div>
    <div id="admin-panel">
        <h3 style="color:var(--accent); margin-top:0;">📊 GÜNLÜK KASA</h3>
        <div id="order-log" style="font-size: 0.8rem; line-height: 1.6; color:#8b949e;">Satış yok.</div>
        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
        <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>TOPLAM:</span><span id="total-revenue" style="color:var(--accent);">0 TL</span></div>
    </div>
</div>

<div class="footer">
    <div><div style="font-size: 0.6rem; color:#8b949e;">TOPLAM</div><div class="total-amount" id="cart-total">0 TL</div></div>
    <button style="background:var(--accent); border:none; padding:12px 20px; border-radius:12px; font-weight:900; cursor:pointer;" onclick="showOrder()">SİPARİŞ VER</button>
</div>

<div id="receipt-page" class="full-page">
    <div class="receipt-card">
        <h2 style="color:var(--accent); text-align:center;">ÖZET</h2>
        <div id="receipt-list"></div>
        <div style="font-size: 2rem; color: var(--accent); text-align: center; margin: 20px 0; font-weight: 900;" id="receipt-sum">0 TL</div>
        <button id="wa-send" style="width:100%; padding:18px; border-radius:15px; background:#25D366; border:none; color:white; font-weight:bold; cursor:pointer;">WHATSAPP'A GÖNDER</button>
        <button style="width:100%; margin-top:10px; background:transparent; border:none; color:#8b949e; cursor:pointer;" onclick="closePage('receipt-page')">Geri Dön</button>
    </div>
</div>

<script>
    const CONFIG = { 
        phone: "905333875829", 
        m: "MjYwNg==", // '2606' şifresinin Base64 hali
        folder: "barmenu/" 
    };

    const inventory = [
        { id: 'KiNoBi', cat: 'GIN (CİN)', name: 'Ki No Bi Kyoto Gin', shot: 400, bottle: 3800, img: 'KiNoBiGin.png' },
        { id: 'EtsuP', cat: 'GIN (CİN)', name: 'Etsu Pacific Ocean', shot: 320, bottle: 3800, img: 'EtsuP.png' },
        { id: 'Nikka', cat: 'GIN (CİN)', name: 'Nikka Coffey Gin', shot: 270, bottle: 3200, img: 'nikka.png' },
        { id: 'Gunp', cat: 'GIN (CİN)', name: 'Gunpowder Gin', shot: 250, bottle: 3000, img: 'gunpowder.png' },
        { id: 'Skag', cat: 'GIN (CİN)', name: 'Skagerrak Gin', shot: 220, bottle: 2600, img: 'skagerrak.png' },
        { id: 'Mosaik', cat: 'GIN (CİN)', name: 'Mosaik Gin', shot: 200, bottle: 2575, img: 'MosaikGin.png' },
        { id: 'Roku', cat: 'GIN (CİN)', name: 'Roku Gin', shot: 190, bottle: 2400, img: 'RokuGin.png' },
        { id: 'NoTen', cat: 'GIN (CİN)', name: 'Tanqueray No. Ten', shot: 180, bottle: 2000, img: 'noten.png' },
        { id: 'MalfyL', cat: 'GIN (CİN)', name: 'Malfy Limone', shot: 160, bottle: 2200, img: 'MalfyLimoneGin.png' },
        { id: '1800S', cat: 'TEKİLA, ROM & VİSKİ', name: '1800 Silver Tequila', shot: 250, bottle: 3000, img: '1800.png' },
        { id: 'Skinos', cat: 'LİKÖRLER', name: 'Skinos Mastic', shot: 140, bottle: 1900, img: 'Skinos.png' },
        { id: 'Triple', cat: 'LİKÖRLER', name: 'Jest Triple Sec', shot: 40, bottle: 1025, img: 'Jest.png' },
        { id: 'Mancia', cat: 'LİKÖRLER', name: 'Mancia', shot: 40, bottle: 800, img: 'emoji' }
    ];

    let cart = {}; let total = 0; let isAdmin = false;

    function render() {
        let html = ''; let lastCat = '';
        const sortedItems = [...inventory].sort((a,b) => (a.cat === b.cat) ? b.shot - a.shot : 0);
        
        sortedItems.forEach(item => {
            if (item.cat !== lastCat) { html += `<div class="cat-title">${item.cat}</div>`; lastCat = item.cat; }
            const img = item.img === 'emoji' ? '🍷' : `<img src="${CONFIG.folder + item.img}" onerror="this.style.opacity='0.1'">`;
            const bPrice = isAdmin ? `<span style="color:#666"> | Şişe: ${item.bottle} TL</span>` : '';
            html += `<div class="item"><div class="bottle-info"><div class="img-box">${img}</div><div class="details"><span class="name">${item.name}</span><span class="prices">Shot: <b style="color:var(--accent)">${item.shot} TL</b>${bPrice}</span></div></div><div class="controls"><button class="btn" onclick="qty('${item.id}',-1)">-</button><span class="qty" id="q-${item.id}">${cart[item.id]||0}</span><button class="btn" onclick="qty('${item.id}',1)">+</button></div></div>`;
        });
        document.getElementById('menu-list').innerHTML = html;
        updateKasa();
    }

    function qty(id, d) {
        cart[id] = (cart[id] || 0) + d; if (cart[id] < 0) cart[id] = 0;
        total = Object.keys(cart).reduce((sum, k) => sum + (cart[k] * inventory.find(i => i.id === k).shot), 0);
        document.getElementById(`q-${id}`).innerText = cart[id];
        document.getElementById('cart-total').innerText = total + " TL";
    }

    function openAuth() { 
        if(isAdmin) { 
            isAdmin=false; document.getElementById('admin-panel').style.display='none'; render(); 
        } else { 
            document.getElementById('pass-modal').style.display='flex'; 
            document.getElementById('passInput').focus(); 
        } 
    }
    function closeModal() { document.getElementById('pass-modal').style.display = 'none'; document.getElementById('passInput').value = ''; }

    function verifyPass() {
        const input = document.getElementById('passInput').value;
        if (btoa(input) === CONFIG.m) {
            isAdmin = true; document.getElementById('admin-panel').style.display = 'block'; closeModal(); render();
        } else { 
            alert("Şifre Yanlış!"); 
            document.getElementById('passInput').value = ''; 
        }
    }

    function showOrder() {
        if (total === 0) return;
        let listHtml = ''; let msg = '🍸 *YENİ SİPARİŞ*%0A';
        inventory.forEach(i => { if(cart[i.id]>0) { listHtml += `<div class="receipt-item"><span>${cart[i.id]}x ${i.name}</span><span>${cart[i.id]*i.shot} TL</span></div>`; msg += `• ${cart[i.id]}x ${i.name}%0A`; }});
        document.getElementById('receipt-list').innerHTML = listHtml;
        document.getElementById('receipt-sum').innerText = total + " TL";
        document.getElementById('receipt-page').style.display = 'block';
        document.getElementById('wa-send').onclick = () => {
            window.open(`https://wa.me/${CONFIG.phone}?text=${msg}%0A*TOPLAM: ${total} TL*`);
            logOrder(); closePage('receipt-page'); cart = {}; total = 0; render();
            document.getElementById('cart-total').innerText = "0 TL";
        };
    }

    function logOrder() {
        const history = JSON.parse(localStorage.getItem('barLog') || '[]');
        history.push({ time: new Date().toLocaleTimeString('tr-TR'), total: total });
        localStorage.setItem('barLog', JSON.stringify(history));
    }

    function updateKasa() {
        const history = JSON.parse(localStorage.getItem('barLog') || '[]');
        const logDiv = document.getElementById('order-log');
        if(history.length === 0) { logDiv.innerText = "Satış yok."; return; }
        let sum = 0; logDiv.innerHTML = history.map(o => { sum += o.total; return `<div>[${o.time}] Satış: ${o.total} TL</div>`; }).join('');
        document.getElementById('total-revenue').innerText = sum + " TL";
    }

    function closePage(id) { document.getElementById(id).style.display = 'none'; }
    
    document.getElementById('passInput').addEventListener('keyup', (e) => {
        if(e.key === 'Enter') verifyPass();
    });

    render();
</script>
</body>
</html>
