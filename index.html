<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZURE BAR V12.4</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #a2d2ff; --text: #e6edf3; --border: #30363d; --success: #238636; --wp: #25D366; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; user-select: none; }

        .container { max-width: 500px; margin: auto; padding: 20px; }
        h1 { text-align: center; color: var(--accent); letter-spacing: 5px; margin: 30px 0; cursor: pointer; }
        
        .cat-title { font-size: 0.7rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin: 25px 0 12px; font-weight: 800; }
        
        /* Klasik Sekme/Kart Yapısı */
        .menu-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-info .name { font-weight: 700; display: block; }
        .item-info .price { color: var(--accent); font-size: 0.9rem; font-weight: 600; }

        /* Geri Gelen Seçim Ekranı (Klasik ama şık) */
        .variant-area { background: #0b0e14; border-radius: 12px; padding: 10px; margin-top: 10px; display: none; }
        .v-row { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .v-row:last-child { border: none; }
        .v-row.active { color: var(--accent); font-weight: 800; }

        /* Admin & Modal */
        #admin-panel { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 2000; padding: 20px; overflow-y: auto; }
        .order-card { background: var(--card); border-left: 4px solid var(--accent); padding: 12px; margin-bottom: 10px; border-radius: 4px; }
        
        #payment-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); z-index: 3000; width: 90%; max-width: 350px; text-align: center; display: none; }
        .iban-box { background: #000; padding: 15px; border-radius: 10px; margin: 15px 0; color: var(--accent); font-family: monospace; cursor: pointer; }
        .wp-btn { background: var(--wp); color: white; padding: 12px; border-radius: 12px; display: block; text-decoration: none; font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="askAdmin()">AZURE</h1>
    
    <div class="cat-title">İMZA KOKTEYLLER</div>
    <div class="menu-item" onclick="toggleVariants()">
        <div class="item-info">
            <span class="name">MIDNIGHT SILK</span>
            <span class="price">450 - 600 TL</span>
        </div>
        <div id="arrow">▼</div>
    </div>
    
    <div id="variant-area" class="variant-area">
        </div>

    <div class="cat-title">PREMİUM GİNLER</div>
    <div id="gin-list"></div>
</div>

<div id="admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:var(--accent)">Barmen Paneli</h2>
        <button onclick="closeAdmin()">Kapat</button>
    </div>
    <div id="admin-orders"></div>
</div>

<div id="payment-modal">
    <h3>Sipariş Alındı!</h3>
    <div class="iban-box" onclick="copyIban()">TR00 0000 0000 0000 0000 0000 00</div>
    <a href="#" id="wp-link" class="wp-btn">WhatsApp'tan Yaz</a>
    <p onclick="location.reload()" style="cursor:pointer; opacity:0.5; margin-top:15px;">Kapat</p>
</div>

<script>
    const CONFIG = { phone: "905333875829", pass: "MjYwNg==" };
    const variants = [
        { id: 'v1', name: 'Classic Silk', p: 450, rec: '5cl Vodka, 5cl Baileys, 3cl Malibu' },
        { id: 'v2', name: 'Botanical Silk', p: 480, rec: '5cl Gin, 5cl Baileys, 3cl Malibu' },
        { id: 'v3', name: 'Aged Silk', p: 500, rec: '5cl Vodka, 5cl Baileys, 5cl Havana 7' },
        { id: 'v4', name: 'Double Choco', p: 600, rec: 'Classic + Baileys & Olmeca Choco' }
    ];
    const gins = [{name:'Nikka Coffey', p:420}, {name:'Ki No Bi', p:400}, {name:'Etsu Pacific', p:350}, {name:'Roku Gin', p:250}];

    let selected = 'v1';

    function init() {
        let gH = '';
        gins.forEach(g => gH += `<div class="menu-item"><div class="item-info"><span class="name">${g.name}</span><span class="price">${g.p} TL</span></div></div>`);
        document.getElementById('gin-list').innerHTML = gH;

        let vH = '';
        variants.forEach(v => vH += `<div class="v-row" onclick="selectV('${v.id}')"><span>${v.name}</span><span>${v.p} TL</span></div>`);
        vH += `<button onclick="orderNow()" style="width:100%; padding:15px; background:var(--accent); border:none; border-radius:8px; margin-top:10px; font-weight:800;">SİPARİŞ VER</button>`;
        document.getElementById('variant-area').innerHTML = vH;
    }

    function toggleVariants() { 
        const el = document.getElementById('variant-area');
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function selectV(id) { 
        selected = id; 
        document.querySelectorAll('.v-row').forEach((r, i) => {
            r.classList.toggle('active', variants[i].id === id);
        });
    }

    function orderNow() {
        const v = variants.find(x => x.id === selected);
        let orders = JSON.parse(localStorage.getItem('az_orders')) || [];
        orders.push({ name: v.name, rec: v.rec, time: new Date().toLocaleTimeString() });
        localStorage.setItem('az_orders', JSON.stringify(orders));

        document.getElementById('payment-modal').style.display = 'block';
        document.getElementById('wp-link').href = `https://wa.me/${CONFIG.phone}?text=Sipariş: ${v.name}`;
    }

    function askAdmin() {
        if(btoa(prompt("Şifre:")) === CONFIG.pass) {
            document.getElementById('admin-panel').style.display = 'block';
            renderAdmin();
        }
    }

    function renderAdmin() {
        let orders = JSON.parse(localStorage.getItem('az_orders')) || [];
        let h = '';
        orders.reverse().forEach(o => h += `<div class="order-card"><b>${o.name}</b><br><small>${o.rec}</small><br><small>${o.time}</small></div>`);
        document.getElementById('admin-orders').innerHTML = h || 'Sipariş yok.';
    }

    function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
    function copyIban() { navigator.clipboard.writeText("TR00 0000 0000 0000 0000 0000 00"); alert("Kopyalandı!"); }

    init();
</script>
</body>
</html>
